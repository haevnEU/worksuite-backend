plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.haevn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/haevneu/redmineclient")
        credentials {
            username = findProperty("gpr.user") ?: System.getenv("GPR_USER")
            password = findProperty("gpr.key") ?: System.getenv("GPR_KEY")
        }
    }
}

bootRun {
    if (project.hasProperty('debug') && project.property('debug') == 'true') {
        jvmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    }
}

dependencies {
    implementation 'de.haevn:redmineclient:1.5-SNAPSHOT'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE'
    implementation 'org.gitlab4j:gitlab4j-api:6.3.0'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'com.openhtmltopdf:openhtmltopdf-svg-support:1.0.10'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

springBoot {
    buildInfo()
}

def generatedGitPropsDir = layout.buildDirectory.dir("generated-resources/git")

tasks.register('generateGitProperties') {
    outputs.dir(generatedGitPropsDir)

    doLast {
        def gitCommit = "unknown"
        def gitCommitShort = "unknown"
        def gitBranch = "unknown"

        try {
            def commitOut = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', 'HEAD'
                standardOutput = commitOut
                ignoreExitValue = true
            }
            gitCommit = commitOut.toString().trim()
            if (!gitCommit.isEmpty() && gitCommit.length() >= 7) {
                gitCommitShort = gitCommit.substring(0, 7)
            }

            def branchOut = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
                standardOutput = branchOut
                ignoreExitValue = true
            }
            gitBranch = branchOut.toString().trim()
        } catch (Exception ignored) {
            // Fallback für Container-Builds oder Umgebungen ohne .git
        }

        def dir = generatedGitPropsDir.get().asFile
        dir.mkdirs()
        def gitPropsFile = new File(dir, "git.properties")

        gitPropsFile.text = """# Generated by Gradle
git.commit.id=${gitCommit}
git.commit.id.abbrev=${gitCommitShort}
git.commit.id.describe=${gitCommitShort}
git.branch=${gitBranch}
git.build.time=${java.time.Instant.now().toString()}
"""
    }
}

sourceSets {
    main {
        resources {
            srcDir(generateGitProperties)
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}