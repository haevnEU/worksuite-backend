spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=10m

  mongodb:
    uri: ${SPRING_MONGODB_URI}
    representation:
      uuid: standard

jwt:
  secret: ${JWT_SECRET}

app:
  redmine:
    url: ${REDMINE_URL}
    api-key: ${REDMINE_API_KEY}
  vcs:
    url: ${GITLAB_URL}
    api-key: ${GITLAB_API_KEY}